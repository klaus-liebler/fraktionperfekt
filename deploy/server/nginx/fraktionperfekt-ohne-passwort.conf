# FraktionPerfekt-Pfade OHNE Zugangspasswort (Vorlage → /etc/nginx/snippets/@DIENST@-ohne-passwort.conf).
# Nach Änderung: sudo nginx -t && sudo systemctl reload nginx
#
# Kalender-Abos (webcal/ICS): Kalender-Apps können kein Basic-Auth-Passwort mitschicken; die Adresse enthält ein geheimes Token
# (in der Datenbank nur als Hash), das jederzeit widerrufen werden kann.
location ^~ @PFAD@/kalender/abo/ { include /etc/nginx/snippets/@DIENST@-proxy.conf; }
# Lebenszeichen (nur „ok“, keine Inhalte)
location = @PFAD@/gesund { include /etc/nginx/snippets/@DIENST@-proxy.conf; }
